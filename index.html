  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
      background: #ffffff;
    }
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      text-align: center;
      transition: opacity 0.25s ease;
    }
    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo-badge {
      display: none;
      align-items: center;
      justify-content: center;
      width: 82px;
      height: 82px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      padding: 8px;
    }
    .logo-badge.ready {
      display: flex;
    }
    .logo-badge img {
      width: 64px;
      height: 62px;
      object-fit: contain;
      display: block;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(148, 163, 184, 0.28);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .loader-sub {
      font-size: 12.5px;
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.5;
    }
    .fallback-box {
      display: none;
      margin-top: 6px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .fallback-box.show {
      display: flex;
    }
    .fallback-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .btn-direct {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn-direct:hover {
      background: #1d4ed8;
    }
    .btn-dismiss {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.5);
      color: #e2e8f0;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-dismiss:hover {
      background: rgba(51, 65, 85, 0.7);
    }
    .noscript-box {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <noscript>
    <div class="noscript-box">
      <div class="loader-title">JavaScript Dibutuhkan</div>
      <div class="loader-sub">Aktifkan JavaScript di browser Anda atau buka aplikasi langsung lewat tautan di bawah ini:</div>
      <a class="btn-direct" href="https://script.google.com/macros/s/AKfycbzacsukkMkqkQEUhWQzEF8UJRlMnnfuAX4nfDDf2cMKNiew1FrFF9K6beI0hAriwY6CYg/exec" rel="noopener noreferrer">Buka Aplikasi SI-PALING</a>
    </div>
  </noscript>

  <div id="loaderOverlay" class="loader-overlay">
    <div id="logoBadge" class="logo-badge">
      <img id="splashLogo" alt="Logo SI-PALING" width="64" height="62">
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="loader-title">System Education Test (SI-PALING)</div>
    <div class="loader-sub">Menghubungkan ke server CAT Kecermatan Polri...</div>
    <div id="fallbackBox" class="fallback-box">
      <div class="loader-sub">Memuat terlalu lama atau iframe diblokir oleh pengaturan privasi browser?</div>
      <div class="fallback-actions">
        <a id="directFallbackLink" class="btn-direct" href="https://script.google.com/macros/s/AKfycbzacsukkMkqkQEUhWQzEF8UJRlMnnfuAX4nfDDf2cMKNiew1FrFF9K6beI0hAriwY6CYg/exec" rel="noopener noreferrer">
          Buka Aplikasi Langsung
        </a>
        <button id="btnHideOverlay" type="button" class="btn-dismiss">Tutup Layar Tunggu</button>
      </div>
    </div>
  </div>

  <iframe
    id="gasAppFrame"
    class="app-frame"
    title="System Education Test (SI-PALING) - CAT Kecermatan Polri"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    (function () {
      // =========================================================================
      // KONFIGURASI LINK WEB APP GOOGLE APPS SCRIPT (/exec)
      // Ganti URL di bawah ini jika Anda melakukan "New deployment" baru di GAS
      // (Ganti juga tautan di bagian <noscript> dan href fallback jika diperlukan)
      // =========================================================================
      var GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzacsukkMkqkQEUhWQzEF8UJRlMnnfuAX4nfDDf2cMKNiew1FrFF9K6beI0hAriwY6CYg/exec';

      var frame = document.getElementById('gasAppFrame');
      var loader = document.getElementById('loaderOverlay');
      var fallback = document.getElementById('fallbackBox');
      var directLink = document.getElementById('directFallbackLink');
      var btnHide = document.getElementById('btnHideOverlay');
      var favEl = document.getElementById('appFavicon');
      var logoBadge = document.getElementById('logoBadge');
      var splashLogo = document.getElementById('splashLogo');
      var isLoaded = false;

      // Sinkronkan favicon Base64 ke apple-touch-icon & logo splash (single-source)
      if (favEl) {
        var iconUri = favEl.getAttribute('href');
        if (iconUri) {
          var appleIcon = document.createElement('link');
          appleIcon.rel = 'apple-touch-icon';
          appleIcon.href = iconUri;
          document.head.appendChild(appleIcon);

          if (splashLogo && logoBadge) {
            splashLogo.src = iconUri;
            logoBadge.className = 'logo-badge ready';
          }
        }
      }

      if (directLink) {
        directLink.href = GAS_EXEC_URL;
      }

      function hideLoader() {
        if (!loader) return;
        loader.className = 'loader-overlay hidden';
        setTimeout(function () {
          loader.style.display = 'none';
        }, 260);
      }

      if (btnHide) {
        btnHide.addEventListener('click', function () {
          isLoaded = true;
          hideLoader();
        });
      }

      var slowTimer = setTimeout(function () {
        if (!isLoaded && fallback) {
          fallback.className = 'fallback-box show';
        }
      }, 7000);

      if (frame) {
        frame.addEventListener('load', function () {
          isLoaded = true;
          clearTimeout(slowTimer);
          hideLoader();
        });
        frame.src = GAS_EXEC_URL;
      }
    })();
  </script>
</body>
