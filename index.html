<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>System Education Test (SI-PALING) - CAT Kecermatan Polri</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e293b'/%3E%3Cpath d='M32 10L12 19v13c0 12.6 8.5 24.4 20 28 11.5-3.6 20-15.4 20-28V19L32 10z' fill='%232563eb'/%3E%3Cpath d='M25 32l5 5 10-11' stroke='%23ffffff' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
      background: #ffffff;
    }
    .loader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      transition: opacity 0.25s ease;
    }
    .loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(148, 163, 184, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .loader-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .fallback-box {
      display: none;
      margin-top: 8px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .fallback-box.show {
      display: flex;
    }
    .btn-direct {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-direct:hover {
      background: #1d4ed8;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loaderOverlay" class="loader-overlay">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loader-title">SI-PALING CAT Kecermatan</div>
    <div class="loader-sub">Menghubungkan ke server aplikasi...</div>
    <div id="fallbackBox" class="fallback-box">
      <div class="loader-sub">Memuat terlalu lama atau diblokir browser?</div>
      <a class="btn-direct" href="https://script.google.com/macros/s/AKfycbzacsukkMkqkQEUhWQzEF8UJRlMnnfuAX4nfDDf2cMKNiew1FrFF9K6beI0hAriwY6CYg/exec" rel="noopener noreferrer">
        Buka Aplikasi Langsung
      </a>
    </div>
  </div>

  <iframe
    id="gasAppFrame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbzacsukkMkqkQEUhWQzEF8UJRlMnnfuAX4nfDDf2cMKNiew1FrFF9K6beI0hAriwY6CYg/exec"
    title="System Education Test (SI-PALING) - CAT Kecermatan Polri"
    allow="fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    (function () {
      var frame = document.getElementById('gasAppFrame');
      var loader = document.getElementById('loaderOverlay');
      var fallback = document.getElementById('fallbackBox');
      var isLoaded = false;

      var slowTimer = setTimeout(function () {
        if (!isLoaded && fallback) {
          fallback.className = 'fallback-box show';
        }
      }, 7000);

      if (frame) {
        frame.addEventListener('load', function () {
          isLoaded = true;
          clearTimeout(slowTimer);
          if (loader) {
            loader.className = 'loader-overlay hidden';
            setTimeout(function () {
              loader.style.display = 'none';
            }, 260);
          }
        });
      }
    })();
  </script>
</body>
</html>
